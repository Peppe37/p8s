site_name: p8s
site_description: 🔥 Forge AI-native, full-stack applications with the fire of the gods
site_url: https://peppe37.github.io/p8s/
repo_url: https://github.com/Peppe37/p8s
repo_name: Peppe37/p8s

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - About: about.md
  - Documentation:
    - Getting Started: getting-started.md
    - CLI Reference: cli.md
    - Models & Database: models.md
    - Migrations: migrations.md
    - Authentication: authentication.md
    - Admin Panel: admin.md
    - Forms: forms.md
    - Middleware: middleware.md
    - AI Features: ai.md
    - Testing: testing.md
    - Configuration: configuration.md
    - Deployment: deployment.md
    - Static Files: staticfiles.md
    - Signals: signals.md
    - Permissions: permissions.md
    - Email: email.md
    - Cache: cache.md
    - Architecture: RnD/architecture.md


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list

copyright: Copyright &copy; 2024 Giuseppe La Pietra
